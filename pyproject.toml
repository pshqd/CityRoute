[project]
name = "cityroute"
version = "0.1.0"
description = "Single-courier constrained routing research backend"
readme = "README.md"
authors = [
    { name = "Polina", email = "tsarevapln@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
]

[project.scripts]
cityroute = "cityroute:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
